apiVersion: 1

# Loads every dashboard JSON in /var/lib/grafana/dashboards (monitoring/grafana/dashboards).
# Change a dashboard by editing its JSON and committing it, not in the UI.
providers:
  - name: tamagotchi-go
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
