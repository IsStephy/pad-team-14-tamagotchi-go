# Lab 3: Map, Monster Raid and Battle run as several replicas that publish no ports.
# Clients still open their WebSockets on one host port per service; nginx
# passes each connection (and plain HTTP) on to the service name, which
# Docker's DNS resolves to every replica. State is shared through Redis, so
# any replica can serve any socket.
#
# Resolving at request time (resolver + variable) picks up replicas added or
# removed while the stack runs.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8085;
    location / {
        set $map http://map-service:8085;
        proxy_pass $map;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}

server {
    listen 8086;
    location / {
        set $raid http://monster-raid-service:8086;
        proxy_pass $raid;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}

server {
    listen 8082;
    location / {
        set $battle http://battle-service:8082;
        proxy_pass $battle;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
