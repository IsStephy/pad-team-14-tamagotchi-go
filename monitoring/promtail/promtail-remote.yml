# Promtail for a machine that runs extra replicas (monitoring/docker-compose.logs.yml).
#
# Ships the log lines of every Compose container on this machine to the main
# machine's Loki (LOKI_URL), labelled like the main machine's: `service`,
# `container`, `level`, plus `machine` (MACHINE), so Grafana shows every
# replica's logs in one place and tells the machines apart.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Containers started by Compose (each service's replica file), not this Promtail.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: (.+)
        action: keep
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: promtail
        action: drop
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /?(.*)
        target_label: container
      - target_label: machine
        replacement: ${MACHINE}
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
