# Lab 3: Map, Monster Raid, Guild and Package Registry run as several
# replicas that publish no ports. Clients still open their WebSockets on one
# host port per service; nginx passes each connection (and plain HTTP) on to
# the service name, which Docker's DNS resolves to every replica. State is
# shared (Map and Monster Raid through Redis, Guild through PostgreSQL), so
# any replica can serve any socket. Package Registry has no WebSocket: its
# port is here so direct HTTP calls (the Postman collection) keep working.
#
# Resolving at request time (resolver + variable) picks up replicas added or
# removed while the stack runs.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8085;
    location / {
        set $map http://map-service:8085;
        proxy_pass $map;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}

server {
    listen 8086;
    location / {
        set $raid http://monster-raid-service:8086;
        proxy_pass $raid;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}

# Guild chat (WS /guilds/{guildId}/chat). Used tickets and chat messages are
# shared in Guild's PostgreSQL (LISTEN/NOTIFY), so members on different
# replicas still see each other's messages.
server {
    listen 8087;
    location / {
        set $guild http://guild-service:8087;
        proxy_pass $guild;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}

# Package Registry: plain HTTP only.
server {
    listen 8088;
    location / {
        set $registry http://package-registry-service:8088;
        proxy_pass $registry;
server {
    listen 8082;
    location / {
        set $battle http://battle-service:8082;
        proxy_pass $battle;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
