# Shared stack for Tamagotchi Go (Team 14).
#
# Runs the published services, each with the database(s) it owns, straight from
# their Docker Hub images — no source checkout of any service repo needed.
#
#   cp .env.example .env     # then replace every change_me
#   docker compose up -d
#
# Adding your service — conventions, so entries don't collide:
#
#   service name   the repo name             e.g. guild-service
#   database name  <service>-db              e.g. guild-service-db
#   volume name    <service>-db-data         e.g. guild-service-db-data
#   env prefix     <SERVICE>_                e.g. GUILD_DB_PASSWORD
#   image          your published Docker Hub image, never a build: context;
#                  the stack uses :latest - the newest release to main
#
# Databases publish no host port: services reach them over the Compose network
# by service name. Claim your host port in the README's port table and add your
# variables to .env.example with placeholder values only.

name: tamagotchi-go

services:

  # --------------------------------------------------------------- Go / user
  user-management-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${USER_MANAGEMENT_DB_NAME:-user_management_db}
      POSTGRES_USER: ${USER_MANAGEMENT_DB_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - user-management-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  user-management-service:
    image: pshasuleiman/user-management-service:latest
    depends_on:
      user-management-service-db:
        condition: service_healthy
    environment:
      PORT: 8081
      DB_HOST: user-management-service-db
      DB_PORT: 5432
      DB_NAME: ${USER_MANAGEMENT_DB_NAME:-user_management_db}
      DB_USER: ${USER_MANAGEMENT_DB_USER:?set it in .env — copy .env.example}
      DB_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD:?set it in .env — copy .env.example}
      DB_SSLMODE: disable
      JWT_TTL: ${USER_MANAGEMENT_JWT_TTL:-24h}
      # RS256 signing key. Generated on start-up and persisted in the database
      # when unset, so the stack works out of the box; set it in production so
      # the key survives a database reset.
      JWT_PRIVATE_KEY: ${USER_MANAGEMENT_JWT_PRIVATE_KEY:-}
      # Access rules from the contract's Authentication section. Off until the
      # team turns them on together: enforcing before every caller sends
      # credentials would break them.
      AUTH_ENFORCED: ${AUTH_ENFORCED:-false}
      SERVICE_KEY_BATTLE: ${SERVICE_KEY_BATTLE:-}
      SERVICE_KEY_MONSTER_RAID: ${SERVICE_KEY_MONSTER_RAID:-}
      SERVICE_KEY_MAP: ${SERVICE_KEY_MAP:-}
    ports:
      - "${USER_MANAGEMENT_PORT:-8081}:8081"
    restart: unless-stopped

  # ------------------------------------------------------------- Go / battle

  battle-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BATTLE_DB_NAME:-battle_db}
      POSTGRES_USER: ${BATTLE_DB_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - battle-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis that remembers used WebSocket tickets until they expire, so each
  # ticket opens one live socket.
  battle-service-cache:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${BATTLE_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - battle-service-cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  battle-service:
    image: pshasuleiman/battle-service:latest
    depends_on:
      battle-service-db:
        condition: service_healthy
      battle-service-cache:
        condition: service_healthy
      user-management-service:
        condition: service_started
    environment:
      PORT: 8082
      DB_HOST: battle-service-db
      DB_PORT: 5432
      DB_NAME: ${BATTLE_DB_NAME:-battle_db}
      DB_USER: ${BATTLE_DB_USER:?set it in .env — copy .env.example}
      DB_PASSWORD: ${BATTLE_DB_PASSWORD:?set it in .env — copy .env.example}
      DB_SSLMODE: disable
      # Service-to-service REST goes through the gateway, like client traffic:
      # currency adjust (User Management), types, xp and transfer-owner
      # (Tamagotchi) and package stat definitions (Package Registry).
      USER_MANAGEMENT_SERVICE_URL: ${BATTLE_USER_MANAGEMENT_URL:-http://gateway:8080}
      TAMAGOTCHI_SERVICE_URL: ${BATTLE_TAMAGOTCHI_SERVICE_URL:-http://gateway:8080}
      PACKAGE_REGISTRY_SERVICE_URL: ${BATTLE_PACKAGE_REGISTRY_URL:-http://gateway:8080}
      AUTH_ENFORCED: ${AUTH_ENFORCED:-false}
      # The key this service presents to the Service-only endpoints it calls.
      SERVICE_KEY: ${SERVICE_KEY_BATTLE:-}
      # WS /battles/{battleId}/live: clients connect here directly with the
      # single-use ticket the gateway signs with GATEWAY_KEY; used ticket ids
      # are kept in Redis, and MAX_WS_CONNECTIONS caps open sockets (1013).
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      REDIS_URL: redis://:${BATTLE_REDIS_PASSWORD}@battle-service-cache:6379/0
      MAX_WS_CONNECTIONS: ${BATTLE_MAX_WS_CONNECTIONS:-500}
    ports:
      # Published for the live socket too: the gateway's /ws/negotiate hands
      # clients ws://localhost:8082/battles/{battleId}/live.
      - "${BATTLE_PORT:-8082}:8082"


  # ------------------------------------------------------- Go / tamagotchi
  # PostgreSQL for Tamagotchis; the service creates its schema on start-up.

  tamagotchi-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TAMAGOTCHI_DB_NAME:-tamagotchi_db}
      POSTGRES_USER: ${TAMAGOTCHI_DB_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - tamagotchi-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tamagotchi-service:
    image: dan1el50/tamagotchi-service:latest
    depends_on:
      tamagotchi-service-db:
        condition: service_healthy
    environment:
      PORT: 8083
      APP_ENV: production
      # Requests are only accepted from the API Gateway (its X-Gateway-Key).
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      DATABASE_URL: postgres://${TAMAGOTCHI_DB_USER}:${TAMAGOTCHI_DB_PASSWORD}@tamagotchi-service-db:5432/${TAMAGOTCHI_DB_NAME:-tamagotchi_db}?sslmode=disable
      REQUEST_TIMEOUT_MS: ${TAMAGOTCHI_REQUEST_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${TAMAGOTCHI_MAX_CONCURRENT_REQUESTS:-10}
      # Reached through the gateway: X-User-Id is trusted only with this key.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # Battle calls xp and transfer-owner; Monster Raid reads GET /tamagotchis/{id}.
      SERVICE_KEY_BATTLE: ${SERVICE_KEY_BATTLE:-}
      SERVICE_KEY_MONSTER_RAID: ${SERVICE_KEY_MONSTER_RAID:-}
      # Empty = Package Registry through the gateway (http://gateway:8080).
      PACKAGE_REGISTRY_URL: ${TAMAGOTCHI_PACKAGE_REGISTRY_URL:-}
    ports:
      - "${TAMAGOTCHI_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------- Go / notification
  # Redis with append-only persistence; notifications expire after 30 days.

  notification-service-db:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - notification-service-db-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  notification-service:
    image: dan1el50/notification-service:latest
    depends_on:
      notification-service-db:
        condition: service_healthy
    environment:
      PORT: 8084
      APP_ENV: production
      # Requests are only accepted from the API Gateway (its X-Gateway-Key).
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      REDIS_URL: redis://:${NOTIFICATION_REDIS_PASSWORD}@notification-service-db:6379/0
      REQUEST_TIMEOUT_MS: ${NOTIFICATION_REQUEST_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${NOTIFICATION_MAX_CONCURRENT_REQUESTS:-10}
      MAX_CONCURRENT_EVENTS: ${NOTIFICATION_MAX_CONCURRENT_EVENTS:-10}
      # Reached through the gateway: X-User-Id is trusted only with this key.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
    ports:
      - "${NOTIFICATION_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------- TypeScript / map
  # Redis (geospatial) with append-only persistence.
  map-service-db:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - map-service-db-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  map-service:
    image: dackohn/map-service:latest
    depends_on:
      map-service-db:
        condition: service_healthy
    environment:
      PORT: 8085
      REDIS_URL: redis://:${MAP_REDIS_PASSWORD:?set it in .env — copy .env.example}@map-service-db:6379
      # Every request must carry this key (X-Gateway-Key); stream tickets are
      # signed with it too. The service no longer verifies user tokens.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # Relationships come from User Management, through the gateway, as Map
      # (X-Service-Key).
      USER_MANAGEMENT_URL: ${MAP_USER_MANAGEMENT_URL:-http://gateway:8080}
      USER_MANAGEMENT_SERVICE_KEY: ${SERVICE_KEY_MAP:-}
      REQUEST_TIMEOUT_MS: ${MAP_REQUEST_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${MAP_MAX_CONCURRENT_REQUESTS:-100}
      UPSTREAM_TIMEOUT_MS: ${MAP_UPSTREAM_TIMEOUT_MS:-3000}
      REDIS_COMMAND_TIMEOUT_MS: ${MAP_REDIS_COMMAND_TIMEOUT_MS:-2000}
      MAX_WS_CONNECTIONS: ${MAP_MAX_WS_CONNECTIONS:-1000}
    ports:
      - "${MAP_PORT:-8085}:8085"
    restart: unless-stopped

  # --------------------------------------------------- TypeScript / monster raid
  # PostgreSQL for raid records; the service runs its migrations on start-up.

  monster-raid-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MONSTER_RAID_DB_NAME:-monster_raid_db}
      POSTGRES_USER: ${MONSTER_RAID_DB_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${MONSTER_RAID_DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - monster-raid-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis for live monster HP and idempotency keys.

  monster-raid-service-cache:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - monster-raid-service-cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  monster-raid-service:
    image: dackohn/monster-raid-service:latest
    depends_on:
      monster-raid-service-db:
        condition: service_healthy
      monster-raid-service-cache:
        condition: service_healthy
    environment:
      PORT: 8086
      DATABASE_URL: postgresql://${MONSTER_RAID_DB_USER}:${MONSTER_RAID_DB_PASSWORD}@monster-raid-service-db:5432/${MONSTER_RAID_DB_NAME:-monster_raid_db}
      REDIS_URL: redis://:${MONSTER_RAID_REDIS_PASSWORD}@monster-raid-service-cache:6379
      # Every request must carry this key (X-Gateway-Key); live-raid tickets
      # are signed with it too. The service no longer verifies user tokens.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # Guild (membership), Tamagotchi (ownership, attack power) and User
      # Management (rewards) are called through the gateway, as Monster Raid:
      # each call carries SERVICE_KEY_MONSTER_RAID as X-Service-Key.
      GUILD_SERVICE_URL: ${MONSTER_RAID_GUILD_SERVICE_URL:-http://gateway:8080}
      TAMAGOTCHI_SERVICE_URL: ${MONSTER_RAID_TAMAGOTCHI_SERVICE_URL:-http://gateway:8080}
      USER_MANAGEMENT_URL: ${MONSTER_RAID_USER_MANAGEMENT_URL:-http://gateway:8080}
      GUILD_SERVICE_KEY: ${SERVICE_KEY_MONSTER_RAID:-}
      TAMAGOTCHI_SERVICE_KEY: ${SERVICE_KEY_MONSTER_RAID:-}
      USER_MANAGEMENT_SERVICE_KEY: ${SERVICE_KEY_MONSTER_RAID:-}
      # POST /raids accepts only Package Registry's key: the same value
      # Package Registry sends, so it is set once in .env.
      SERVICE_KEYS: package-registry-service=${PACKAGE_REGISTRY_MONSTER_RAID_SERVICE_KEY:-}
      REQUEST_TIMEOUT_MS: ${MONSTER_RAID_REQUEST_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${MONSTER_RAID_MAX_CONCURRENT_REQUESTS:-100}
      UPSTREAM_TIMEOUT_MS: ${MONSTER_RAID_UPSTREAM_TIMEOUT_MS:-3000}
      REDIS_COMMAND_TIMEOUT_MS: ${MONSTER_RAID_REDIS_COMMAND_TIMEOUT_MS:-2000}
      PG_STATEMENT_TIMEOUT_MS: ${MONSTER_RAID_PG_STATEMENT_TIMEOUT_MS:-3000}
      MAX_WS_CONNECTIONS: ${MONSTER_RAID_MAX_WS_CONNECTIONS:-1000}
    ports:
      - "${MONSTER_RAID_PORT:-8086}:8086"
    restart: unless-stopped

  # --------------------------------------------------------- TypeScript / guild
  # PostgreSQL for guilds, members and chat; the service runs its migrations
  # on start-up.
  guild-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${GUILD_DB_NAME:-guild_db}
      POSTGRES_USER: ${GUILD_DB_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - guild-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  guild-service:
    # :latest = the newest version released to main (moved by the repo's release
    # workflow). Run `docker compose pull` to get a new release.
    image: isstephy1/guild-service:latest
    depends_on:
      guild-service-db:
        condition: service_healthy
    environment:
      PORT: 8087
      DB_HOST: guild-service-db
      DB_PORT: 5432
      DB_NAME: ${GUILD_DB_NAME:-guild_db}
      DB_USER: ${GUILD_DB_USER:?set it in .env — copy .env.example}
      DB_PASSWORD: ${GUILD_DB_PASSWORD:?set it in .env — copy .env.example}
      # Every request must carry this key (X-Gateway-Key); chat tickets are
      # signed with it too. The service no longer verifies user tokens.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # Monster Raid's own key: it reads GET /guilds/{guildId} as itself.
      SERVICE_KEY_MONSTER_RAID: ${SERVICE_KEY_MONSTER_RAID:-}
      REQUEST_TIMEOUT_MS: ${GUILD_REQUEST_TIMEOUT_MS:-8000}
      MAX_CONCURRENT_REQUESTS: ${GUILD_MAX_CONCURRENT_REQUESTS:-40}
      MAX_WS_CONNECTIONS: ${GUILD_MAX_WS_CONNECTIONS:-500}
    ports:
      - "${GUILD_PORT:-8087}:8087"
    restart: unless-stopped

  # ----------------------------------------------- TypeScript / package registry
  # PostgreSQL for packages, stat definitions, admins and raid configs; the
  # service runs its migrations on start-up.

  package-registry-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PACKAGE_REGISTRY_DB_NAME:-package_registry_db}
      POSTGRES_USER: ${PACKAGE_REGISTRY_DB_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - package-registry-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  package-registry-service:
    # :latest = the newest version released to main (moved by the repo's release
    # workflow). Run `docker compose pull` to get a new release.
    image: isstephy1/package-registry-service:latest
    depends_on:
      package-registry-service-db:
        condition: service_healthy
    environment:
      PORT: 8088
      DB_HOST: package-registry-service-db
      DB_PORT: 5432
      DB_NAME: ${PACKAGE_REGISTRY_DB_NAME:-package_registry_db}
      DB_USER: ${PACKAGE_REGISTRY_DB_USER:?set it in .env — copy .env.example}
      DB_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD:?set it in .env — copy .env.example}
      # Every request must carry this key (X-Gateway-Key). The service no
      # longer verifies user tokens.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # POST /admins itself needs an admin, so the first one is seeded here.
      PACKAGE_REGISTRY_INITIAL_ADMIN_USER_ID: ${PACKAGE_REGISTRY_INITIAL_ADMIN_USER_ID:-admin-1}
      # POST /raids goes through the gateway, like all service-to-service
      # REST, carrying our service key.
      MONSTER_RAID_URL: ${PACKAGE_REGISTRY_MONSTER_RAID_URL:-http://gateway:8080}
      MONSTER_RAID_SERVICE_KEY: ${PACKAGE_REGISTRY_MONSTER_RAID_SERVICE_KEY:-}
      REQUEST_TIMEOUT_MS: ${PACKAGE_REGISTRY_REQUEST_TIMEOUT_MS:-8000}
      MONSTER_RAID_TIMEOUT_MS: ${PACKAGE_REGISTRY_MONSTER_RAID_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${PACKAGE_REGISTRY_MAX_CONCURRENT_REQUESTS:-40}
    ports:
      - "${PACKAGE_REGISTRY_PORT:-8088}:8088"
    restart: unless-stopped

  # ------------------------------------------------------------ Python / gateway
  # The single entry point: clients, and services calling each other, go
  # through it. It verifies user tokens against User Management's keys, strips
  # Authorization and forwards the verified user as X-User-Id + X-Gateway-Key.
  # Service URLs default to http://<service-name>:<port>, matching this file.
  gateway:
    # :latest = the newest version released to main (moved by the repo's release
    # workflow). Run `docker compose pull` to get a new release.
    image: isstephy1/gateway:latest
    depends_on:
      - user-management-service
      - battle-service
      - tamagotchi-service
      - notification-service
      - map-service
      - monster-raid-service
      - guild-service
      - package-registry-service
    environment:
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      AUTH_MODE: ${GATEWAY_AUTH_MODE:-gateway}
      REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-100}
      MAX_CONCURRENT_PER_SERVICE: ${GATEWAY_MAX_CONCURRENT_PER_SERVICE:-50}
      # What GET /ws/negotiate hands to clients: each service's own host port,
      # since the socket connects to the service directly.
      BATTLE_WS_PUBLIC_URL: ws://localhost:${BATTLE_PORT:-8082}
      MAP_WS_PUBLIC_URL: ws://localhost:${MAP_PORT:-8085}
      MONSTER_RAID_WS_PUBLIC_URL: ws://localhost:${MONSTER_RAID_PORT:-8086}
      GUILD_WS_PUBLIC_URL: ws://localhost:${GUILD_PORT:-8087}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped

# Named volumes keep each database's data across restarts and rebuilds.
# `docker compose down` keeps them; `docker compose down -v` deletes them.
volumes:
  user-management-service-db-data:
  battle-service-db-data:
  battle-service-cache-data:
  tamagotchi-service-db-data:
  notification-service-db-data:
  map-service-db-data:
  monster-raid-service-db-data:
  monster-raid-service-cache-data:
  guild-service-db-data:
  package-registry-service-db-data:
