# Shared stack for Tamagotchi Go (Team 14).
#
# Runs the published services, each with the database(s) it owns, straight from
# their Docker Hub images — no source checkout of any service repo needed.
#
#   cp .env.example .env     # then replace every change_me
#   docker compose up -d
#
# Adding your service — conventions, so entries don't collide:
#
#   service name   the repo name             e.g. guild-service
#   database name  <service>-db              e.g. guild-service-db
#   volume name    <service>-db-data         e.g. guild-service-db-data
#   env prefix     <SERVICE>_                e.g. GUILD_DB_PASSWORD
#   image          your published Docker Hub image, never a build: context;
#                  the stack uses :latest - the newest release to main
#
# Databases publish no host port: services reach them over the Compose network
# by service name. Claim your host port in the README's port table and add your
# variables to .env.example with placeholder values only.

name: tamagotchi-go

# ---------------------------------------------------- replication (shared parts)
# Postgres: <service>-db-0..2 run repmgr (db-0 starts as primary; another node
# is promoted when the primary stops); <service>-db is pgpool in front of them,
# so the address a service connects to never changes. All queries go to the
# primary. Redis: a master and 2 replicas per store, watched by the 3 shared
# Sentinels. Sentinel watches the nodes by IP on the redis-replication network:
# a stopped container's name stops resolving, and Sentinel stalls on that
# instead of failing over. Addresses there:
#   .11-.13   monster-raid-service-cache, -1, -2
#   .21-.23   map-service-db, -1, -2
#   .31-.33   notification-service-db, -1, -2
#   .41-.43   battle-service-cache, -1, -2
#   .201-.203 redis-sentinel-1..3
#   another store: the next free block of ten below .64, and a monitor block below.
#   .64-.127 is for containers without a fixed address (the services).
x-monster-raid-db: &monster-raid-db
  image: bitnamilegacy/postgresql-repmgr:16
  environment: &monster-raid-db-env
    POSTGRESQL_POSTGRES_PASSWORD: ${MONSTER_RAID_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
    # The init script below runs as postgres: here the app user isn't a
    # superuser, and its migrations create the etl_reader role.
    POSTGRESQL_INITSCRIPTS_USERNAME: postgres
    POSTGRESQL_INITSCRIPTS_PASSWORD: ${MONSTER_RAID_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
    POSTGRESQL_USERNAME: ${MONSTER_RAID_DB_USER:?set it in .env — copy .env.example}
    POSTGRESQL_PASSWORD: ${MONSTER_RAID_DB_PASSWORD:?set it in .env — copy .env.example}
    POSTGRESQL_DATABASE: ${MONSTER_RAID_DB_NAME:-monster_raid_db}
    REPMGR_PASSWORD: ${MONSTER_RAID_REPMGR_PASSWORD:?set it in .env — copy .env.example}
    REPMGR_PRIMARY_HOST: monster-raid-service-db-0
    REPMGR_PARTNER_NODES: monster-raid-service-db-0,monster-raid-service-db-1,monster-raid-service-db-2
    # A replica is promoted ~10 s after the primary stops (the defaults take ~45 s).
    REPMGR_RECONNECT_ATTEMPTS: "2"
    REPMGR_RECONNECT_INTERVAL: "2"
    REPMGR_MASTER_RESPONSE_TIMEOUT: "5"
  configs:
    - source: monster-raid-db-init
      target: /docker-entrypoint-initdb.d/10-app-user.sql
  healthcheck:
    test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRESQL_PASSWORD\" pg_isready -h 127.0.0.1 -U \"$$POSTGRESQL_USERNAME\" -d \"$$POSTGRESQL_DATABASE\""]
    interval: 5s
    timeout: 5s
    retries: 30
  restart: unless-stopped
  # Two fixes before the image's own entrypoint (the same as Guild's and
  # Package Registry's nodes):
  # - repmgrd keeps its PID file in /tmp, which survives a container restart:
  #   after an unclean stop it took the stale file for a live repmgrd and the
  #   node restarted forever. Only that file is removed.
  # - A node that was the primary before it stopped waits 30 s, so the new
  #   primary's repmgrd has marked it inactive and it rejoins as a replica
  #   instead of starting as a second primary with old data.
  entrypoint:
    - /bin/sh
    - -c
    - |
      rm -f /tmp/repmgrd.pid
      if [ -f /bitnami/postgresql/lock/master.lock ]; then
        echo "was the primary before this restart: waiting 30 s for the cluster to settle"
        sleep 30
      fi
      exec /opt/bitnami/scripts/postgresql-repmgr/entrypoint.sh "$$@"
    - --
  command: ["/opt/bitnami/scripts/postgresql-repmgr/run.sh"]

x-tamagotchi-db: &tamagotchi-db
  image: bitnamilegacy/postgresql-repmgr:16
  environment: &tamagotchi-db-env
    POSTGRESQL_POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
    # The init script below runs as postgres: here the app user isn't a
    # superuser, and Tamagotchi creates the etl_reader role at start-up.
    POSTGRESQL_INITSCRIPTS_USERNAME: postgres
    POSTGRESQL_INITSCRIPTS_PASSWORD: ${TAMAGOTCHI_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
    POSTGRESQL_USERNAME: ${TAMAGOTCHI_DB_USER:?set it in .env — copy .env.example}
    POSTGRESQL_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD:?set it in .env — copy .env.example}
    POSTGRESQL_DATABASE: ${TAMAGOTCHI_DB_NAME:-tamagotchi_db}
    REPMGR_PASSWORD: ${TAMAGOTCHI_REPMGR_PASSWORD:?set it in .env — copy .env.example}
    REPMGR_PRIMARY_HOST: tamagotchi-service-db-0
    REPMGR_PARTNER_NODES: tamagotchi-service-db-0,tamagotchi-service-db-1,tamagotchi-service-db-2
    # A replica is promoted ~10 s after the primary stops (the defaults take ~45 s).
    REPMGR_RECONNECT_ATTEMPTS: "2"
    REPMGR_RECONNECT_INTERVAL: "2"
    REPMGR_MASTER_RESPONSE_TIMEOUT: "5"
  configs:
    - source: tamagotchi-db-init
      target: /docker-entrypoint-initdb.d/10-app-user.sql
  healthcheck:
    test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRESQL_PASSWORD\" pg_isready -h 127.0.0.1 -U \"$$POSTGRESQL_USERNAME\" -d \"$$POSTGRESQL_DATABASE\""]
    interval: 5s
    timeout: 5s
    retries: 30
  restart: unless-stopped

x-user-management-db: &user-management-db
  image: bitnamilegacy/postgresql-repmgr:16
  environment: &user-management-db-env
    POSTGRESQL_POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
    # The init script below runs as postgres: here the app user isn't a
    # superuser, and User Management creates the etl_reader role at start-up.
    POSTGRESQL_INITSCRIPTS_USERNAME: postgres
    POSTGRESQL_INITSCRIPTS_PASSWORD: ${USER_MANAGEMENT_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
    POSTGRESQL_USERNAME: ${USER_MANAGEMENT_DB_USER:?set it in .env — copy .env.example}
    POSTGRESQL_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD:?set it in .env — copy .env.example}
    POSTGRESQL_DATABASE: ${USER_MANAGEMENT_DB_NAME:-user_management_db}
    REPMGR_PASSWORD: ${USER_MANAGEMENT_REPMGR_PASSWORD:?set it in .env — copy .env.example}
    REPMGR_PRIMARY_HOST: user-management-service-db-0
    REPMGR_PARTNER_NODES: user-management-service-db-0,user-management-service-db-1,user-management-service-db-2
    # A replica is promoted ~10 s after the primary stops (the defaults take ~45 s).
    REPMGR_RECONNECT_ATTEMPTS: "2"
    REPMGR_RECONNECT_INTERVAL: "2"
    REPMGR_MASTER_RESPONSE_TIMEOUT: "5"
  configs:
    - source: user-management-service-db-init
      target: /docker-entrypoint-initdb.d/10-app-user.sql
  healthcheck:
    test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRESQL_PASSWORD\" pg_isready -h 127.0.0.1 -U \"$$POSTGRESQL_USERNAME\" -d \"$$POSTGRESQL_DATABASE\""]
    interval: 5s
    timeout: 5s
    retries: 30
  restart: unless-stopped

x-battle-db: &battle-db
  image: bitnamilegacy/postgresql-repmgr:16
  environment: &battle-db-env
    POSTGRESQL_POSTGRES_PASSWORD: ${BATTLE_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
    # The init script below runs as postgres: here the app user isn't a
    # superuser, and Battle creates the etl_reader role at start-up.
    POSTGRESQL_INITSCRIPTS_USERNAME: postgres
    POSTGRESQL_INITSCRIPTS_PASSWORD: ${BATTLE_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
    POSTGRESQL_USERNAME: ${BATTLE_DB_USER:?set it in .env — copy .env.example}
    POSTGRESQL_PASSWORD: ${BATTLE_DB_PASSWORD:?set it in .env — copy .env.example}
    POSTGRESQL_DATABASE: ${BATTLE_DB_NAME:-battle_db}
    REPMGR_PASSWORD: ${BATTLE_REPMGR_PASSWORD:?set it in .env — copy .env.example}
    REPMGR_PRIMARY_HOST: battle-service-db-0
    REPMGR_PARTNER_NODES: battle-service-db-0,battle-service-db-1,battle-service-db-2
    # A replica is promoted ~10 s after the primary stops (the defaults take ~45 s).
    REPMGR_RECONNECT_ATTEMPTS: "2"
    REPMGR_RECONNECT_INTERVAL: "2"
    REPMGR_MASTER_RESPONSE_TIMEOUT: "5"
  configs:
    - source: battle-service-db-init
      target: /docker-entrypoint-initdb.d/10-app-user.sql
  healthcheck:
    test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRESQL_PASSWORD\" pg_isready -h 127.0.0.1 -U \"$$POSTGRESQL_USERNAME\" -d \"$$POSTGRESQL_DATABASE\""]
    interval: 5s
    timeout: 5s
    retries: 30
  restart: unless-stopped

x-redis-node: &redis-node
  image: redis:7-alpine
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

x-redis-sentinel: &redis-sentinel
  image: redis:7-alpine
  environment:
    MAP_REDIS_PASSWORD: ${MAP_REDIS_PASSWORD:?set it in .env — copy .env.example}
    MONSTER_RAID_REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD:?set it in .env — copy .env.example}
    NOTIFICATION_REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD:?set it in .env — copy .env.example}
    BATTLE_REDIS_PASSWORD: ${BATTLE_REDIS_PASSWORD:?set it in .env — copy .env.example}
  # Sentinel rewrites its config as it learns, so it is written fresh at start.
  # One block per watched master; 2 of the 3 Sentinels must agree to fail over.
  command:
    - sh
    - -c
    - |
      printf '%s\n' \
        'port 26379' \
        'sentinel monitor map-service-db 172.29.14.21 6379 2' \
        "sentinel auth-pass map-service-db $$MAP_REDIS_PASSWORD" \
        'sentinel down-after-milliseconds map-service-db 5000' \
        'sentinel failover-timeout map-service-db 30000' \
        'sentinel monitor monster-raid-service-cache 172.29.14.11 6379 2' \
        "sentinel auth-pass monster-raid-service-cache $$MONSTER_RAID_REDIS_PASSWORD" \
        'sentinel down-after-milliseconds monster-raid-service-cache 5000' \
        'sentinel failover-timeout monster-raid-service-cache 30000' \
        'sentinel monitor notification-service-db 172.29.14.31 6379 2' \
        "sentinel auth-pass notification-service-db $$NOTIFICATION_REDIS_PASSWORD" \
        'sentinel down-after-milliseconds notification-service-db 5000' \
        'sentinel failover-timeout notification-service-db 30000' \
        'sentinel monitor battle-service-cache 172.29.14.41 6379 2' \
        "sentinel auth-pass battle-service-cache $$BATTLE_REDIS_PASSWORD" \
        'sentinel down-after-milliseconds battle-service-cache 5000' \
        'sentinel failover-timeout battle-service-cache 30000' \
        > /tmp/sentinel.conf
      exec redis-sentinel /tmp/sentinel.conf
  depends_on:
    map-service-db:
      condition: service_healthy
    monster-raid-service-cache:
      condition: service_healthy
    notification-service-db:
      condition: service_healthy
    battle-service-cache:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

networks:
  default: {}
  redis-replication:
    ipam:
      config:
        - subnet: 172.29.14.0/24
          # Containers without a fixed address (the services on this network)
          # get one from .64-.127 only, so they can never take a store's or a
          # Sentinel's fixed address (.11-.59, .201-.203) before it starts.
          ip_range: 172.29.14.64/26

configs:
  monster-raid-db-init:
    content: |
      ALTER ROLE "${MONSTER_RAID_DB_USER}" CREATEROLE;
  tamagotchi-db-init:
    content: |
      ALTER ROLE "${TAMAGOTCHI_DB_USER}" CREATEROLE;
  user-management-service-db-init:
    content: |
      ALTER ROLE "${USER_MANAGEMENT_DB_USER}" CREATEROLE;
  battle-service-db-init:
    content: |
      ALTER ROLE "${BATTLE_DB_USER}" CREATEROLE;

services:

  # --------------------------------------------------------------- Go / user
  # PostgreSQL for User Management: a primary and 2 replicas (repmgr) behind pgpool.
  # The service creates its schema on start-up, through pgpool.
  user-management-service-db-0:
    <<: *user-management-db
    environment:
      <<: *user-management-db-env
      REPMGR_NODE_NAME: user-management-service-db-0
      REPMGR_NODE_NETWORK_NAME: user-management-service-db-0
    volumes:
      - user-management-service-db-0-data:/bitnami/postgresql

  user-management-service-db-1:
    <<: *user-management-db
    environment:
      <<: *user-management-db-env
      REPMGR_NODE_NAME: user-management-service-db-1
      REPMGR_NODE_NETWORK_NAME: user-management-service-db-1
    volumes:
      - user-management-service-db-1-data:/bitnami/postgresql

  user-management-service-db-2:
    <<: *user-management-db
    environment:
      <<: *user-management-db-env
      REPMGR_NODE_NAME: user-management-service-db-2
      REPMGR_NODE_NETWORK_NAME: user-management-service-db-2
    volumes:
      - user-management-service-db-2-data:/bitnami/postgresql

  # pgpool keeps the old address, so DB_HOST doesn't change. Every query goes
  # to the current primary (no load balancing: replicas lag behind, and the
  # schema migration's advisory lock only works on the primary).
  user-management-service-db:
    image: bitnamilegacy/pgpool:4
    environment:
      PGPOOL_BACKEND_NODES: 0:user-management-service-db-0:5432,1:user-management-service-db-1:5432,2:user-management-service-db-2:5432
      PGPOOL_BACKEND_APPLICATION_NAMES: user-management-service-db-0,user-management-service-db-1,user-management-service-db-2
      PGPOOL_SR_CHECK_USER: ${USER_MANAGEMENT_DB_USER:?set it in .env — copy .env.example}
      PGPOOL_SR_CHECK_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_SR_CHECK_PERIOD: "2"
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: ${USER_MANAGEMENT_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: ${USER_MANAGEMENT_PGPOOL_ADMIN_PASSWORD:?set it in .env — copy .env.example}
      # Who logs in through pgpool: the service, and the ETL's read-only role.
      PGPOOL_POSTGRES_CUSTOM_USERS: ${USER_MANAGEMENT_DB_USER},etl_reader
      PGPOOL_POSTGRES_CUSTOM_PASSWORDS: ${USER_MANAGEMENT_DB_PASSWORD},${USER_MANAGEMENT_ETL_DB_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_AUTO_FAILBACK: "yes"
      PGPOOL_HEALTH_CHECK_PERIOD: "2"
      PGPOOL_HEALTH_CHECK_TIMEOUT: "2"
      PGPOOL_HEALTH_CHECK_MAX_RETRIES: "2"
      PGPOOL_HEALTH_CHECK_RETRY_DELAY: "1"
      PGPOOL_CONNECT_TIMEOUT: "2000"
    depends_on:
      user-management-service-db-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  user-management-service:
    image: pshasuleiman/user-management-service:latest
    # Replicas (Lab 3): each registers itself with Service Discovery under its
    # own hostname, so no container_name and no published port.
    deploy:
      replicas: ${USER_MANAGEMENT_REPLICAS:-3}
    depends_on:
      user-management-service-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    environment:
      PORT: 8081
      DB_HOST: user-management-service-db
      DB_PORT: 5432
      # The password of the read-only role the ETL logs in with (through pgpool).
      ETL_DB_PASSWORD: ${USER_MANAGEMENT_ETL_DB_PASSWORD:?set it in .env — copy .env.example}
      DB_NAME: ${USER_MANAGEMENT_DB_NAME:-user_management_db}
      DB_USER: ${USER_MANAGEMENT_DB_USER:?set it in .env — copy .env.example}
      DB_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD:?set it in .env — copy .env.example}
      DB_SSLMODE: disable
      JWT_TTL: ${USER_MANAGEMENT_JWT_TTL:-24h}
      # Task timeout (504) and concurrent task limit (503 + Retry-After).
      REQUEST_TIMEOUT_MS: ${USER_MANAGEMENT_REQUEST_TIMEOUT_MS:-8000}
      MAX_CONCURRENT_REQUESTS: ${USER_MANAGEMENT_MAX_CONCURRENT_REQUESTS:-50}
      # RS256 signing key. Generated on start-up and persisted in the database
      # when unset, so the stack works out of the box; set it in production so
      # the key survives a database reset.
      JWT_PRIVATE_KEY: ${USER_MANAGEMENT_JWT_PRIVATE_KEY:-}
      # Authorization is at the gateway: only requests carrying its key as
      # X-Gateway-Key are served, and the player comes as X-User-Id. A service
      # sends its own X-Service-Key, which opens only the endpoints that list
      # that service (README, User Management, "Service callers").
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      SERVICE_KEY_BATTLE: ${SERVICE_KEY_BATTLE:-}
      SERVICE_KEY_MONSTER_RAID: ${SERVICE_KEY_MONSTER_RAID:-}
      SERVICE_KEY_MAP: ${SERVICE_KEY_MAP:-}
      SERVICE_KEY_GUILD: ${SERVICE_KEY_GUILD:-}
      SERVICE_KEY_PACKAGE_REGISTRY: ${SERVICE_KEY_PACKAGE_REGISTRY:-}
      # Message Broker (Lab 4): events go to its topics, a service's call it
      # relays is accepted with BROKER_KEY plus the caller's service key, and
      # each replica registers the topics it consumes (battle.ended,
      # raid.completed, taken at POST /events).
      BROKER_URL: http://message-broker:8090
      BROKER_KEY: ${BROKER_KEY:?set it in .env — copy .env.example}
      # gRPC (GetUser, GetBalance, AdjustCurrency, GetRelationship): registered
      # with Service Discovery as metadata.grpcPort, reached through the broker.
      GRPC_PORT: 50081
      # Each replica registers as http://<its hostname>:8081, sends heartbeats
      # and deregisters on shutdown; it keeps retrying while Service Discovery
      # is not up.
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      LOG_LEVEL: ${USER_MANAGEMENT_LOG_LEVEL:-info}
    # No published port: the gateway and the broker reach it on the Compose
    # network (http://<replica>:8081, gRPC on <replica>:50081).
    restart: unless-stopped

  # ------------------------------------------------------------- Go / battle

  # PostgreSQL for Battle: a primary and 2 replicas (repmgr) behind pgpool.
  # The service creates its schema on start-up, through pgpool.
  battle-service-db-0:
    <<: *battle-db
    environment:
      <<: *battle-db-env
      REPMGR_NODE_NAME: battle-service-db-0
      REPMGR_NODE_NETWORK_NAME: battle-service-db-0
    volumes:
      - battle-service-db-0-data:/bitnami/postgresql

  battle-service-db-1:
    <<: *battle-db
    environment:
      <<: *battle-db-env
      REPMGR_NODE_NAME: battle-service-db-1
      REPMGR_NODE_NETWORK_NAME: battle-service-db-1
    volumes:
      - battle-service-db-1-data:/bitnami/postgresql

  battle-service-db-2:
    <<: *battle-db
    environment:
      <<: *battle-db-env
      REPMGR_NODE_NAME: battle-service-db-2
      REPMGR_NODE_NETWORK_NAME: battle-service-db-2
    volumes:
      - battle-service-db-2-data:/bitnami/postgresql

  # pgpool keeps the old address, so DB_HOST doesn't change. Every query goes
  # to the current primary (no load balancing: replicas lag behind, and the
  # schema migration's advisory lock only works on the primary).
  battle-service-db:
    image: bitnamilegacy/pgpool:4
    environment:
      PGPOOL_BACKEND_NODES: 0:battle-service-db-0:5432,1:battle-service-db-1:5432,2:battle-service-db-2:5432
      PGPOOL_BACKEND_APPLICATION_NAMES: battle-service-db-0,battle-service-db-1,battle-service-db-2
      PGPOOL_SR_CHECK_USER: ${BATTLE_DB_USER:?set it in .env — copy .env.example}
      PGPOOL_SR_CHECK_PASSWORD: ${BATTLE_DB_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_SR_CHECK_PERIOD: "2"
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: ${BATTLE_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: ${BATTLE_PGPOOL_ADMIN_PASSWORD:?set it in .env — copy .env.example}
      # Who logs in through pgpool: the service, and the ETL's read-only role.
      PGPOOL_POSTGRES_CUSTOM_USERS: ${BATTLE_DB_USER},etl_reader
      PGPOOL_POSTGRES_CUSTOM_PASSWORDS: ${BATTLE_DB_PASSWORD},${BATTLE_ETL_DB_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_AUTO_FAILBACK: "yes"
      PGPOOL_HEALTH_CHECK_PERIOD: "2"
      PGPOOL_HEALTH_CHECK_TIMEOUT: "2"
      PGPOOL_HEALTH_CHECK_MAX_RETRIES: "2"
      PGPOOL_HEALTH_CHECK_RETRY_DELAY: "1"
      PGPOOL_CONNECT_TIMEOUT: "2000"
    depends_on:
      battle-service-db-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Redis that remembers used WebSocket tickets until they expire, so each
  # ticket opens one live socket, and carries the live turns between replicas.
  # A master and 2 replicas; Battle finds the current master through the
  # Sentinels.
  battle-service-cache:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${BATTLE_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\""]
    volumes:
      - battle-service-cache-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.41}

  battle-service-cache-1:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${BATTLE_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof 172.29.14.41 6379"]
    volumes:
      - battle-service-cache-1-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.42}
    depends_on:
      battle-service-cache:
        condition: service_healthy

  battle-service-cache-2:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${BATTLE_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof 172.29.14.41 6379"]
    volumes:
      - battle-service-cache-2-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.43}
    depends_on:
      battle-service-cache:
        condition: service_healthy

  battle-service:
    image: pshasuleiman/battle-service:latest
    # Replicas (Lab 3): each registers itself with Service Discovery under its
    # own hostname, so no container_name and no published port. Live turns
    # reach the sockets on every replica through Redis pub/sub.
    deploy:
      replicas: ${BATTLE_REPLICAS:-3}
    depends_on:
      battle-service-db:
        condition: service_healthy
      battle-service-cache:
        condition: service_healthy
      user-management-service:
        condition: service_started
      service-discovery:
        condition: service_healthy
    environment:
      PORT: 8082
      DB_HOST: battle-service-db
      DB_PORT: 5432
      # The password of the read-only role the ETL logs in with (through pgpool).
      ETL_DB_PASSWORD: ${BATTLE_ETL_DB_PASSWORD:?set it in .env — copy .env.example}
      DB_NAME: ${BATTLE_DB_NAME:-battle_db}
      DB_USER: ${BATTLE_DB_USER:?set it in .env — copy .env.example}
      DB_PASSWORD: ${BATTLE_DB_PASSWORD:?set it in .env — copy .env.example}
      DB_SSLMODE: disable
      # Only without the broker (BATTLE_BROKER_URL set empty): where Battle's
      # calls go - users and balances (User Management), types and Tamagotchis
      # (Tamagotchi) and package stat definitions (Package Registry).
      USER_MANAGEMENT_SERVICE_URL: ${BATTLE_USER_MANAGEMENT_URL:-http://gateway:8080}
      TAMAGOTCHI_SERVICE_URL: ${BATTLE_TAMAGOTCHI_SERVICE_URL:-http://gateway:8080}
      PACKAGE_REGISTRY_SERVICE_URL: ${BATTLE_PACKAGE_REGISTRY_URL:-http://gateway:8080}
      # The key this service presents to the Service-only endpoints it calls.
      SERVICE_KEY: ${SERVICE_KEY_BATTLE:-}
      # Message Broker (Lab 4): every call goes through it (the URLs above are
      # unused), and battle.ended, battle.request_received and
      # battle.tamagotchi_captured go to its topics. BATTLE_BROKER_URL set
      # empty in .env turns it off.
      BROKER_URL: ${BATTLE_BROKER_URL-http://message-broker:8090}
      BROKER_KEY: ${BROKER_KEY:?set it in .env — copy .env.example}
      # Called over gRPC at message-broker:50051 instead of REST: the services
      # that serve it. Package Registry stays on REST through the broker.
      GRPC_DEPENDENCIES: ${BATTLE_GRPC_DEPENDENCIES-user-management-service,tamagotchi-service}
      # The settlement comes from battle.ended: User Management pays the
      # currency, and with this Tamagotchi awards the XP and moves the captured
      # Tamagotchi, so Battle calls neither. false = Battle calls Tamagotchi's
      # xp and transfer-owner itself (same keys, so never twice).
      TAMAGOTCHI_BY_EVENT: ${BATTLE_TAMAGOTCHI_BY_EVENT:-true}
      # Authorization is at the gateway: only requests carrying GATEWAY_KEY as
      # X-Gateway-Key are served, and the player comes as X-User-Id. Live
      # sockets are opened directly with a single-use ticket the gateway signs
      # with the same key; used ticket ids are kept in Redis, and
      # MAX_WS_CONNECTIONS caps open sockets (1013).
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      REDIS_URL: redis://:${BATTLE_REDIS_PASSWORD}@battle-service-cache:6379/0
      # The current master, through the Sentinels (REDIS_URL then only gives the
      # password and database).
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_MASTER: battle-service-cache
      MAX_WS_CONNECTIONS: ${BATTLE_MAX_WS_CONNECTIONS:-500}
      # Task timeout (504) and concurrent task limit (503 + Retry-After).
      REQUEST_TIMEOUT_MS: ${BATTLE_REQUEST_TIMEOUT_MS:-8000}
      MAX_CONCURRENT_REQUESTS: ${BATTLE_MAX_CONCURRENT_REQUESTS:-50}
      # Circuit breaker per dependency: 3 errors within the request timeout x
      # 3.5 (28 s) pause calls to it. Empty window and cooldown follow that rule.
      CIRCUIT_BREAKER_THRESHOLD: ${BATTLE_CIRCUIT_BREAKER_THRESHOLD:-3}
      CIRCUIT_BREAKER_WINDOW_MS: ${BATTLE_CIRCUIT_BREAKER_WINDOW_MS:-}
      CIRCUIT_BREAKER_COOLDOWN_MS: ${BATTLE_CIRCUIT_BREAKER_COOLDOWN_MS:-}
      # Each replica registers as http://<its hostname>:8082, sends heartbeats
      # and deregisters on shutdown; it keeps retrying while Service Discovery
      # is not up.
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      LOG_LEVEL: ${BATTLE_LOG_LEVEL:-info}
    # No published port: the gateway reaches the replicas at
    # http://battle-service:8082, which Compose DNS resolves to all of them,
    # and clients open the live socket through ws-proxy.
    # The Sentinels hand out the master's address on redis-replication.
    networks: [default, redis-replication]
    restart: unless-stopped


  # ------------------------------------------------------- Go / tamagotchi
  # PostgreSQL for Tamagotchis: a primary and 2 replicas (repmgr) behind pgpool.
  # The service creates its schema on start-up, through pgpool.
  tamagotchi-service-db-0:
    <<: *tamagotchi-db
    environment:
      <<: *tamagotchi-db-env
      REPMGR_NODE_NAME: tamagotchi-service-db-0
      REPMGR_NODE_NETWORK_NAME: tamagotchi-service-db-0
    volumes:
      - tamagotchi-service-db-0-data:/bitnami/postgresql

  tamagotchi-service-db-1:
    <<: *tamagotchi-db
    environment:
      <<: *tamagotchi-db-env
      REPMGR_NODE_NAME: tamagotchi-service-db-1
      REPMGR_NODE_NETWORK_NAME: tamagotchi-service-db-1
    volumes:
      - tamagotchi-service-db-1-data:/bitnami/postgresql

  tamagotchi-service-db-2:
    <<: *tamagotchi-db
    environment:
      <<: *tamagotchi-db-env
      REPMGR_NODE_NAME: tamagotchi-service-db-2
      REPMGR_NODE_NETWORK_NAME: tamagotchi-service-db-2
    volumes:
      - tamagotchi-service-db-2-data:/bitnami/postgresql

  # pgpool keeps the old address, so DATABASE_URL doesn't change. Every query
  # goes to the current primary (no load balancing: replicas lag behind, and
  # the schema migration's advisory lock only works on the primary).
  tamagotchi-service-db:
    image: bitnamilegacy/pgpool:4
    environment:
      PGPOOL_BACKEND_NODES: 0:tamagotchi-service-db-0:5432,1:tamagotchi-service-db-1:5432,2:tamagotchi-service-db-2:5432
      PGPOOL_BACKEND_APPLICATION_NAMES: tamagotchi-service-db-0,tamagotchi-service-db-1,tamagotchi-service-db-2
      PGPOOL_SR_CHECK_USER: ${TAMAGOTCHI_DB_USER:?set it in .env — copy .env.example}
      PGPOOL_SR_CHECK_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_SR_CHECK_PERIOD: "2"
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: ${TAMAGOTCHI_PGPOOL_ADMIN_PASSWORD:?set it in .env — copy .env.example}
      # Who logs in through pgpool: the service, and the ETL's read-only role.
      PGPOOL_POSTGRES_CUSTOM_USERS: ${TAMAGOTCHI_DB_USER},etl_reader
      PGPOOL_POSTGRES_CUSTOM_PASSWORDS: ${TAMAGOTCHI_DB_PASSWORD},${TAMAGOTCHI_ETL_DB_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_AUTO_FAILBACK: "yes"
      PGPOOL_HEALTH_CHECK_PERIOD: "2"
      PGPOOL_HEALTH_CHECK_TIMEOUT: "2"
      PGPOOL_HEALTH_CHECK_MAX_RETRIES: "2"
      PGPOOL_HEALTH_CHECK_RETRY_DELAY: "1"
      PGPOOL_CONNECT_TIMEOUT: "2000"
    depends_on:
      tamagotchi-service-db-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  tamagotchi-service:
    image: dan1el50/tamagotchi-service:latest
    depends_on:
      tamagotchi-service-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    environment:
      PORT: 8083
      APP_ENV: production
      DATABASE_URL: postgres://${TAMAGOTCHI_DB_USER}:${TAMAGOTCHI_DB_PASSWORD}@tamagotchi-service-db:5432/${TAMAGOTCHI_DB_NAME:-tamagotchi_db}?sslmode=disable
      # The password of the read-only role the ETL logs in with (through pgpool).
      ETL_DB_PASSWORD: ${TAMAGOTCHI_ETL_DB_PASSWORD:?set it in .env — copy .env.example}
      REQUEST_TIMEOUT_MS: ${TAMAGOTCHI_REQUEST_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${TAMAGOTCHI_MAX_CONCURRENT_REQUESTS:-10}
      # Reached through the gateway: X-User-Id is trusted only with this key.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # Battle calls xp and transfer-owner; Monster Raid reads GET /tamagotchis/{id}.
      SERVICE_KEY_BATTLE: ${SERVICE_KEY_BATTLE:-}
      SERVICE_KEY_MONSTER_RAID: ${SERVICE_KEY_MONSTER_RAID:-}
      # Empty = Package Registry through the gateway (http://gateway:8080).
      PACKAGE_REGISTRY_URL: ${TAMAGOTCHI_PACKAGE_REGISTRY_URL:-}
      # With BROKER_KEY, Battle and Monster Raid can call through the Message Broker
      # (its key plus their own), and each replica subscribes to battle.ended and
      # applies it at POST /events (one replica per event). TAMAGOTCHI_BROKER_URL
      # (http://message-broker:8090) also sends the Package Registry call through the
      # broker; empty = PACKAGE_REGISTRY_URL above.
      BROKER_KEY: ${BROKER_KEY:?set it in .env — copy .env.example}
      BROKER_URL: ${TAMAGOTCHI_BROKER_URL:-}
      # Lab 5 sagas: the broker's coordinator runs Tamagotchi's steps at POST
      # /saga-steps (broker key only). Set TAMAGOTCHI_APPLY_BATTLE_ENDED=false in the
      # release where Battle settles through the battle-settlement saga: Tamagotchi
      # then stops applying battle.ended (the saga makes those changes).
      APPLY_BATTLE_ENDED: ${TAMAGOTCHI_APPLY_BATTLE_ENDED:-true}
      # gRPC (GetTamagotchi, ListByOwner, GetTypeAdvantages, AddXp, TransferOwner):
      # registered with Service Discovery as metadata.grpcPort, reached through the
      # broker with the same keys as REST. Needs BROKER_KEY.
      GRPC_PORT: 50083
      # Services called over gRPC through the broker at BROKER_GRPC_ADDR instead of
      # REST. Only package-registry-service, once it serves gRPC (#172); empty = REST.
      GRPC_DEPENDENCIES: ${TAMAGOTCHI_GRPC_DEPENDENCIES:-}
      BROKER_GRPC_ADDR: message-broker:50051
      LOG_LEVEL: ${TAMAGOTCHI_LOG_LEVEL:-INFO}
      # The circuit breaker on the call to Package Registry; an empty window or cooldown
      # = the request timeout x 3.5 (17.5 s).
      CIRCUIT_BREAKER_THRESHOLD: ${TAMAGOTCHI_CIRCUIT_BREAKER_THRESHOLD:-3}
      CIRCUIT_BREAKER_WINDOW_MS: ${TAMAGOTCHI_CIRCUIT_BREAKER_WINDOW_MS:-}
      CIRCUIT_BREAKER_COOLDOWN_MS: ${TAMAGOTCHI_CIRCUIT_BREAKER_COOLDOWN_MS:-}
      # Each replica registers its own address (http://<hostname>:8083) here, and
      # deregisters on shutdown. The schema migration takes a lock, so replicas can
      # start together.
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
    # Replicas publish no ports: they're reached only through the gateway.
    deploy:
      replicas: ${TAMAGOTCHI_REPLICAS:-2}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------- Go / notification
  # Redis with append-only persistence; notifications expire after 30 days. A
  # master and 2 replicas; Notification finds the current master through the
  # Sentinels.
  notification-service-db:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\""]
    volumes:
      - notification-service-db-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.31}

  notification-service-db-1:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof 172.29.14.31 6379"]
    volumes:
      - notification-service-db-1-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.32}
    depends_on:
      notification-service-db:
        condition: service_healthy

  notification-service-db-2:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof 172.29.14.31 6379"]
    volumes:
      - notification-service-db-2-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.33}
    depends_on:
      notification-service-db:
        condition: service_healthy

  notification-service:
    image: dan1el50/notification-service:latest
    depends_on:
      notification-service-db:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    environment:
      PORT: 8084
      APP_ENV: production
      REDIS_URL: redis://:${NOTIFICATION_REDIS_PASSWORD}@notification-service-db:6379/0
      # The current master, through the Sentinels (REDIS_URL then only gives the
      # database number; an image without Sentinel support uses it as before).
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_MASTER: notification-service-db
      REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD:?set it in .env — copy .env.example}
      REQUEST_TIMEOUT_MS: ${NOTIFICATION_REQUEST_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${NOTIFICATION_MAX_CONCURRENT_REQUESTS:-10}
      MAX_CONCURRENT_EVENTS: ${NOTIFICATION_MAX_CONCURRENT_EVENTS:-10}
      # Reached through the gateway: X-User-Id is trusted only with this key.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      LOG_LEVEL: ${NOTIFICATION_LOG_LEVEL:-INFO}
      # Each replica registers its own address (http://<hostname>:8084) here. Every
      # replica receives every event; they store each one once (claimed in Redis).
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      # With BROKER_KEY, each replica also registers for the Message Broker's topics
      # and takes events at POST /events (one replica per event); empty = events
      # only from the Redis channel notification-events.
      BROKER_KEY: ${BROKER_KEY:-}
    # Replicas publish no ports: they're reached only through the gateway.
    deploy:
      replicas: ${NOTIFICATION_REPLICAS:-2}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    # The Sentinels hand out the master's address on redis-replication.
    networks: [default, redis-replication]
    restart: unless-stopped

  # ---------------------------------------------------------- TypeScript / map
  # Redis (geospatial) with append-only persistence: Map's database. A master
  # and 2 replicas; Map finds the current master through the Sentinels.
  map-service-db:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\""]
    volumes:
      - map-service-db-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.21}

  map-service-db-1:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof 172.29.14.21 6379"]
    volumes:
      - map-service-db-1-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.22}
    depends_on:
      map-service-db:
        condition: service_healthy

  map-service-db-2:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof 172.29.14.21 6379"]
    volumes:
      - map-service-db-2-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.23}
    depends_on:
      map-service-db:
        condition: service_healthy

  map-service:
    image: dackohn/map-service:latest
    depends_on:
      map-service-db:
        condition: service_healthy
      # Its replicas: nothing else starts them.
      map-service-db-1:
        condition: service_healthy
      map-service-db-2:
        condition: service_healthy
      # It finds its Redis master through the Sentinels (REDIS_SENTINELS).
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    environment:
      # Its cache on the shared cache nodes (cache-1..3), each key on the node the
      # consistent-hash ring picks. MAP_CACHE_NODES set empty in .env turns it off.
      CACHE_NODES: ${MAP_CACHE_NODES:-cache-1:6379,cache-2:6379,cache-3:6379}
      CACHE_PASSWORD: ${CACHE_PASSWORD:-}
      PORT: 8085
      REDIS_URL: redis://:${MAP_REDIS_PASSWORD:?set it in .env — copy .env.example}@map-service-db:6379
      # The current master, through the Sentinels (REDIS_URL only matters for
      # an image without Sentinel support).
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_MASTER: map-service-db
      REDIS_PASSWORD: ${MAP_REDIS_PASSWORD:?set it in .env — copy .env.example}
      # Every request must carry this key (X-Gateway-Key); stream tickets are
      # signed with it too. The service no longer verifies user tokens.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # Relationships come from User Management as Map (X-Service-Key), over
      # gRPC through the broker (GetRelationship). An http:// URL calls REST.
      USER_MANAGEMENT_URL: ${MAP_USER_MANAGEMENT_URL:-grpc://message-broker:50051}
      USER_MANAGEMENT_SERVICE_KEY: ${SERVICE_KEY_MAP:-}
      REQUEST_TIMEOUT_MS: ${MAP_REQUEST_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${MAP_MAX_CONCURRENT_REQUESTS:-100}
      UPSTREAM_TIMEOUT_MS: ${MAP_UPSTREAM_TIMEOUT_MS:-3000}
      REDIS_COMMAND_TIMEOUT_MS: ${MAP_REDIS_COMMAND_TIMEOUT_MS:-2000}
      MAX_WS_CONNECTIONS: ${MAP_MAX_WS_CONNECTIONS:-1000}
      # Each replica registers its own address (http://<hostname>:8085) here.
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      CIRCUIT_BREAKER_THRESHOLD: ${MAP_CIRCUIT_BREAKER_THRESHOLD:-3}
      CIRCUIT_BREAKER_WINDOW_MS: ${MAP_CIRCUIT_BREAKER_WINDOW_MS:-17500}
      CIRCUIT_BREAKER_COOLDOWN_MS: ${MAP_CIRCUIT_BREAKER_COOLDOWN_MS:-30000}
      # REST calls and events go through the Message Broker. MAP_BROKER_URL set
      # empty in .env turns it off (REST calls as above, events only logged).
      # Requests the broker delivers carry BROKER_KEY next to the sender's key.
      BROKER_URL: ${MAP_BROKER_URL-http://message-broker:8090}
      BROKER_KEY: ${BROKER_KEY:?set it in .env — copy .env.example}
      LOG_LEVEL: ${MAP_LOG_LEVEL:-info}
    # Replicas publish no ports: clients reach the location stream through ws-proxy.
    deploy:
      replicas: ${MAP_REPLICAS:-2}
    networks: [default, redis-replication]
    restart: unless-stopped

  # --------------------------------------------------- TypeScript / monster raid
  # PostgreSQL for raid records: a primary and 2 replicas (repmgr) behind
  # pgpool. The service runs its migrations on start-up, through pgpool.
  monster-raid-service-db-0:
    <<: *monster-raid-db
    environment:
      <<: *monster-raid-db-env
      REPMGR_NODE_NAME: monster-raid-service-db-0
      REPMGR_NODE_NETWORK_NAME: monster-raid-service-db-0
    volumes:
      - monster-raid-service-db-0-data:/bitnami/postgresql

  monster-raid-service-db-1:
    <<: *monster-raid-db
    environment:
      <<: *monster-raid-db-env
      REPMGR_NODE_NAME: monster-raid-service-db-1
      REPMGR_NODE_NETWORK_NAME: monster-raid-service-db-1
    volumes:
      - monster-raid-service-db-1-data:/bitnami/postgresql

  monster-raid-service-db-2:
    <<: *monster-raid-db
    environment:
      <<: *monster-raid-db-env
      REPMGR_NODE_NAME: monster-raid-service-db-2
      REPMGR_NODE_NETWORK_NAME: monster-raid-service-db-2
    volumes:
      - monster-raid-service-db-2-data:/bitnami/postgresql

  # pgpool keeps the old address, so DATABASE_URL doesn't change. Every query
  # goes to the current primary (no load balancing: replicas lag behind, and
  # advisory locks only work on the primary).
  monster-raid-service-db:
    image: bitnamilegacy/pgpool:4
    environment:
      PGPOOL_BACKEND_NODES: 0:monster-raid-service-db-0:5432,1:monster-raid-service-db-1:5432,2:monster-raid-service-db-2:5432
      PGPOOL_BACKEND_APPLICATION_NAMES: monster-raid-service-db-0,monster-raid-service-db-1,monster-raid-service-db-2
      PGPOOL_SR_CHECK_USER: ${MONSTER_RAID_DB_USER:?set it in .env — copy .env.example}
      PGPOOL_SR_CHECK_PASSWORD: ${MONSTER_RAID_DB_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_SR_CHECK_PERIOD: "2"
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: ${MONSTER_RAID_DB_ADMIN_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: ${MONSTER_RAID_PGPOOL_ADMIN_PASSWORD:?set it in .env — copy .env.example}
      # Who logs in through pgpool: the service, and the ETL's read-only role.
      PGPOOL_POSTGRES_CUSTOM_USERS: ${MONSTER_RAID_DB_USER},etl_reader
      PGPOOL_POSTGRES_CUSTOM_PASSWORDS: ${MONSTER_RAID_DB_PASSWORD},${MONSTER_RAID_ETL_DB_PASSWORD:?set it in .env — copy .env.example}
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_AUTO_FAILBACK: "yes"
      PGPOOL_HEALTH_CHECK_PERIOD: "2"
      PGPOOL_HEALTH_CHECK_TIMEOUT: "2"
      PGPOOL_HEALTH_CHECK_MAX_RETRIES: "2"
      PGPOOL_HEALTH_CHECK_RETRY_DELAY: "1"
      PGPOOL_CONNECT_TIMEOUT: "2000"
    # All three nodes, not just the first primary: nothing else depends on the
    # replicas, so otherwise `docker compose up monster-raid-service` never
    # starts them, and pgpool started before them marks them down.
    depends_on:
      monster-raid-service-db-0:
        condition: service_healthy
      monster-raid-service-db-1:
        condition: service_healthy
      monster-raid-service-db-2:
        condition: service_healthy
    # Bitnami's check takes 5-6 s while a node is unreachable (pgpool's
    # connect timeout), so 5 s marked a working pgpool unhealthy.
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 10s
      timeout: 15s
      retries: 30
    restart: unless-stopped

  # Redis for live monster HP and idempotency keys: a master and 2 replicas;
  # Monster Raid finds the current master through the Sentinels.
  monster-raid-service-cache:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\""]
    volumes:
      - monster-raid-service-cache-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.11}

  monster-raid-service-cache-1:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof 172.29.14.11 6379"]
    volumes:
      - monster-raid-service-cache-1-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.12}
    depends_on:
      monster-raid-service-cache:
        condition: service_healthy

  monster-raid-service-cache-2:
    <<: *redis-node
    environment:
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --replicaof 172.29.14.11 6379"]
    volumes:
      - monster-raid-service-cache-2-data:/data
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.13}
    depends_on:
      monster-raid-service-cache:
        condition: service_healthy

  # The 3 Sentinels every replicated Redis in the stack shares.
  redis-sentinel-1:
    <<: *redis-sentinel
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.201}

  redis-sentinel-2:
    <<: *redis-sentinel
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.202}

  redis-sentinel-3:
    <<: *redis-sentinel
    networks:
      default: {}
      redis-replication: {ipv4_address: 172.29.14.203}

  monster-raid-service:
    image: dackohn/monster-raid-service:latest
    depends_on:
      monster-raid-service-db:
        condition: service_healthy
      monster-raid-service-cache:
        condition: service_healthy
      # Its replicas: nothing else starts them.
      monster-raid-service-cache-1:
        condition: service_healthy
      monster-raid-service-cache-2:
        condition: service_healthy
      # It finds its Redis master through the Sentinels (REDIS_SENTINELS).
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    environment:
      # Its cache on the shared cache nodes (cache-1..3), each key on the node the
      # consistent-hash ring picks. MONSTER_RAID_CACHE_NODES set empty in .env turns it off.
      CACHE_NODES: ${MONSTER_RAID_CACHE_NODES:-cache-1:6379,cache-2:6379,cache-3:6379}
      CACHE_PASSWORD: ${CACHE_PASSWORD:-}
      PORT: 8086
      DATABASE_URL: postgresql://${MONSTER_RAID_DB_USER}:${MONSTER_RAID_DB_PASSWORD}@monster-raid-service-db:5432/${MONSTER_RAID_DB_NAME:-monster_raid_db}
      REDIS_URL: redis://:${MONSTER_RAID_REDIS_PASSWORD}@monster-raid-service-cache:6379
      # The current master, through the Sentinels (REDIS_URL only matters for
      # an image without Sentinel support).
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_MASTER: monster-raid-service-cache
      REDIS_PASSWORD: ${MONSTER_RAID_REDIS_PASSWORD:?set it in .env — copy .env.example}
      # The password of the read-only role the ETL logs in with (through pgpool).
      ETL_DB_PASSWORD: ${MONSTER_RAID_ETL_DB_PASSWORD:?set it in .env — copy .env.example}
      # Every request must carry this key (X-Gateway-Key); live-raid tickets
      # are signed with it too. The service no longer verifies user tokens.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # Guild (membership), Tamagotchi (ownership, attack power) and User
      # Management (rewards) are called through the broker, as Monster Raid:
      # each call carries SERVICE_KEY_MONSTER_RAID as X-Service-Key. Guild and
      # User Management over gRPC (GetGuild, AdjustCurrency), Tamagotchi over
      # REST (its URL is only used with the broker off).
      GUILD_SERVICE_URL: ${MONSTER_RAID_GUILD_SERVICE_URL:-grpc://message-broker:50051}
      TAMAGOTCHI_SERVICE_URL: ${MONSTER_RAID_TAMAGOTCHI_SERVICE_URL:-}
      USER_MANAGEMENT_URL: ${MONSTER_RAID_USER_MANAGEMENT_URL:-grpc://message-broker:50051}
      GUILD_SERVICE_KEY: ${SERVICE_KEY_MONSTER_RAID:-}
      TAMAGOTCHI_SERVICE_KEY: ${SERVICE_KEY_MONSTER_RAID:-}
      USER_MANAGEMENT_SERVICE_KEY: ${SERVICE_KEY_MONSTER_RAID:-}
      # POST /raids accepts only Package Registry's key: the same value
      # Package Registry sends, so it is set once in .env.
      SERVICE_KEYS: package-registry-service=${PACKAGE_REGISTRY_MONSTER_RAID_SERVICE_KEY:-}
      REQUEST_TIMEOUT_MS: ${MONSTER_RAID_REQUEST_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${MONSTER_RAID_MAX_CONCURRENT_REQUESTS:-100}
      UPSTREAM_TIMEOUT_MS: ${MONSTER_RAID_UPSTREAM_TIMEOUT_MS:-3000}
      REDIS_COMMAND_TIMEOUT_MS: ${MONSTER_RAID_REDIS_COMMAND_TIMEOUT_MS:-2000}
      PG_STATEMENT_TIMEOUT_MS: ${MONSTER_RAID_PG_STATEMENT_TIMEOUT_MS:-3000}
      MAX_WS_CONNECTIONS: ${MONSTER_RAID_MAX_WS_CONNECTIONS:-1000}
      # Each replica registers its own address (http://<hostname>:8086) here.
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      CIRCUIT_BREAKER_THRESHOLD: ${MONSTER_RAID_CIRCUIT_BREAKER_THRESHOLD:-3}
      CIRCUIT_BREAKER_WINDOW_MS: ${MONSTER_RAID_CIRCUIT_BREAKER_WINDOW_MS:-17500}
      CIRCUIT_BREAKER_COOLDOWN_MS: ${MONSTER_RAID_CIRCUIT_BREAKER_COOLDOWN_MS:-30000}
      # REST calls and events go through the Message Broker, and with
      # BROKER_KEY it serves CreateRaid over gRPC (50086) for Package Registry.
      # MONSTER_RAID_BROKER_URL set empty in .env turns the broker off.
      # Requests the broker delivers carry BROKER_KEY next to the sender's key.
      BROKER_URL: ${MONSTER_RAID_BROKER_URL-http://message-broker:8090}
      BROKER_KEY: ${BROKER_KEY:?set it in .env — copy .env.example}
      LOG_LEVEL: ${MONSTER_RAID_LOG_LEVEL:-info}
    # Replicas publish no ports: clients reach the live raid socket through ws-proxy.
    deploy:
      replicas: ${MONSTER_RAID_REPLICAS:-2}
    networks: [default, redis-replication]
    restart: unless-stopped

  # --------------------------------------------------------- TypeScript / guild
  # PostgreSQL for guilds, members and chat; the service runs its migrations
  # on start-up.
  guild-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${GUILD_DB_NAME:-guild_db}
      POSTGRES_USER: ${GUILD_DB_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - guild-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  guild-service:
    # :latest = the newest version released to main (moved by the repo's release
    # workflow). Run `docker compose pull` to get a new release.
    image: isstephy1/guild-service:latest
    depends_on:
      guild-service-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    environment:
      PORT: 8087
      DB_HOST: guild-service-db
      DB_PORT: 5432
      DB_NAME: ${GUILD_DB_NAME:-guild_db}
      DB_USER: ${GUILD_DB_USER:?set it in .env — copy .env.example}
      DB_PASSWORD: ${GUILD_DB_PASSWORD:?set it in .env — copy .env.example}
      # Every request must carry this key (X-Gateway-Key); chat tickets are
      # signed with it too. The service no longer verifies user tokens.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # Monster Raid's own key: it reads GET /guilds/{guildId} as itself.
      SERVICE_KEY_MONSTER_RAID: ${SERVICE_KEY_MONSTER_RAID:-}
      REQUEST_TIMEOUT_MS: ${GUILD_REQUEST_TIMEOUT_MS:-8000}
      MAX_CONCURRENT_REQUESTS: ${GUILD_MAX_CONCURRENT_REQUESTS:-40}
      MAX_WS_CONNECTIONS: ${GUILD_MAX_WS_CONNECTIONS:-500}
      # Each replica registers as http://<its hostname>:8087, sends heartbeats
      # and deregisters on shutdown; it keeps retrying while Service Discovery
      # is not up.
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      # Circuit breaker on every outgoing call: THRESHOLD errors within the
      # window (empty = REQUEST_TIMEOUT_MS x 3.5) trip it; empty cooldown = window.
      CIRCUIT_BREAKER_THRESHOLD: ${GUILD_CIRCUIT_BREAKER_THRESHOLD:-3}
      CIRCUIT_BREAKER_WINDOW_MS: ${GUILD_CIRCUIT_BREAKER_WINDOW_MS:-}
      CIRCUIT_BREAKER_COOLDOWN_MS: ${GUILD_CIRCUIT_BREAKER_COOLDOWN_MS:-}
      # User Management (user exists? enemies?), as this service:
      # SERVICE_KEY_GUILD as X-Service-Key, over gRPC through the broker
      # (GetUser, GetRelationship). An http://message-broker:8090 URL calls REST
      # through it instead.
      USER_MANAGEMENT_URL: ${GUILD_USER_MANAGEMENT_URL:-grpc://message-broker:50051}
      USER_MANAGEMENT_SERVICE_KEY: ${SERVICE_KEY_GUILD:-}
      # Message Broker (Lab 4). BROKER_KEY: calls the broker delivers are
      # accepted with it, and it is sent with Guild's own calls to the broker.
      # GuildInvitation goes to the topic guild.invitation, which Notification
      # subscribes to. GUILD_BROKER_URL set empty in .env turns it off:
      # invitations then reach Notification through Redis, as in Lab 3.
      BROKER_URL: ${GUILD_BROKER_URL-http://message-broker:8090}
      BROKER_KEY: ${BROKER_KEY:?set it in .env — copy .env.example}
      # GuildInvitation events for Notification while BROKER_URL is empty: its
      # Redis Pub/Sub channel notification-events.
      NOTIFICATION_EVENTS_REDIS_URL: redis://:${NOTIFICATION_REDIS_PASSWORD}@notification-service-db:6379/0
      # Lab 5: the shared cache (#225, #231). Every replica reads through
      # cache-1..3, each key on the node the shared hash ring picks. The
      # cache only speeds reads up: a node that is down turns its keys
      # into database reads, so there is no depends_on on the cache nodes.
      CACHE_NODES: ${GUILD_CACHE_NODES:-cache-1:6379,cache-2:6379,cache-3:6379}
      CACHE_PASSWORD: ${CACHE_PASSWORD:-}
      # Lab 5 (#215): password of the read-only role etl_reader, which the
      # service sets at start-up. Empty = the ETL cannot log in.
      ETL_DB_PASSWORD: ${GUILD_ETL_DB_PASSWORD:-}
    # Replicas publish no ports: chat sockets and the Postman
    # collection reach them through ws-proxy (one host port for all replicas).
    deploy:
      replicas: ${GUILD_REPLICAS:-3}
    restart: unless-stopped

  # ----------------------------------------------- TypeScript / package registry
  # PostgreSQL for packages, stat definitions, admins and raid configs; the
  # service runs its migrations on start-up.

  package-registry-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PACKAGE_REGISTRY_DB_NAME:-package_registry_db}
      POSTGRES_USER: ${PACKAGE_REGISTRY_DB_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - package-registry-service-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  package-registry-service:
    # :latest = the newest version released to main (moved by the repo's release
    # workflow). Run `docker compose pull` to get a new release.
    image: isstephy1/package-registry-service:latest
    depends_on:
      package-registry-service-db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    environment:
      PORT: 8088
      DB_HOST: package-registry-service-db
      DB_PORT: 5432
      DB_NAME: ${PACKAGE_REGISTRY_DB_NAME:-package_registry_db}
      DB_USER: ${PACKAGE_REGISTRY_DB_USER:?set it in .env — copy .env.example}
      DB_PASSWORD: ${PACKAGE_REGISTRY_DB_PASSWORD:?set it in .env — copy .env.example}
      # Every request must carry this key (X-Gateway-Key). The service no
      # longer verifies user tokens.
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      # POST /admins itself needs an admin, so the first one is seeded here.
      PACKAGE_REGISTRY_INITIAL_ADMIN_USER_ID: ${PACKAGE_REGISTRY_INITIAL_ADMIN_USER_ID:-admin-1}
      # Activating a raid config creates the raid in Monster Raid, carrying our
      # service key, over gRPC through the broker (CreateRaid). An
      # http://message-broker:8090 URL calls POST /raids through it instead.
      MONSTER_RAID_URL: ${PACKAGE_REGISTRY_MONSTER_RAID_URL:-grpc://message-broker:50051}
      MONSTER_RAID_SERVICE_KEY: ${PACKAGE_REGISTRY_MONSTER_RAID_SERVICE_KEY:-}
      REQUEST_TIMEOUT_MS: ${PACKAGE_REGISTRY_REQUEST_TIMEOUT_MS:-8000}
      MONSTER_RAID_TIMEOUT_MS: ${PACKAGE_REGISTRY_MONSTER_RAID_TIMEOUT_MS:-5000}
      MAX_CONCURRENT_REQUESTS: ${PACKAGE_REGISTRY_MAX_CONCURRENT_REQUESTS:-40}
      # Each replica registers as http://<its hostname>:8088, sends heartbeats
      # and deregisters on shutdown; it keeps retrying while Service Discovery
      # is not up.
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      # Circuit breaker on every outgoing call: THRESHOLD errors within the
      # window (empty = REQUEST_TIMEOUT_MS x 3.5) trip it; empty cooldown = window.
      CIRCUIT_BREAKER_THRESHOLD: ${PACKAGE_REGISTRY_CIRCUIT_BREAKER_THRESHOLD:-3}
      CIRCUIT_BREAKER_WINDOW_MS: ${PACKAGE_REGISTRY_CIRCUIT_BREAKER_WINDOW_MS:-}
      CIRCUIT_BREAKER_COOLDOWN_MS: ${PACKAGE_REGISTRY_CIRCUIT_BREAKER_COOLDOWN_MS:-}
      # User Management (user exists?), as this service: SERVICE_KEY_PACKAGE_REGISTRY
      # as X-Service-Key, over gRPC through the broker (GetUser). An
      # http://message-broker:8090 URL calls REST through it instead.
      USER_MANAGEMENT_URL: ${PACKAGE_REGISTRY_USER_MANAGEMENT_URL:-grpc://message-broker:50051}
      USER_MANAGEMENT_SERVICE_KEY: ${SERVICE_KEY_PACKAGE_REGISTRY:-}
      # Message Broker (Lab 4). BROKER_KEY: calls the broker delivers are
      # accepted with it. A REST call goes through the broker when its URL above
      # is this BROKER_URL; a grpc:// URL goes to the broker's gRPC port.
      BROKER_URL: http://message-broker:8090
      BROKER_KEY: ${BROKER_KEY:?set it in .env — copy .env.example}
      # Lab 5: the shared cache (#225, #231). Every replica reads through
      # cache-1..3, each key on the node the shared hash ring picks. The
      # cache only speeds reads up: a node that is down turns its keys
      # into database reads, so there is no depends_on on the cache nodes.
      CACHE_NODES: ${PACKAGE_REGISTRY_CACHE_NODES:-cache-1:6379,cache-2:6379,cache-3:6379}
      CACHE_PASSWORD: ${CACHE_PASSWORD:-}
      # Lab 5 (#215): password of the read-only role etl_reader, which the
      # service sets at start-up. Empty = the ETL cannot log in.
      ETL_DB_PASSWORD: ${PACKAGE_REGISTRY_ETL_DB_PASSWORD:-}
    # Replicas publish no ports: the gateway finds them in Service
    # Discovery; direct HTTP calls (the Postman collection) go through ws-proxy.
    deploy:
      replicas: ${PACKAGE_REGISTRY_REPLICAS:-3}
    restart: unless-stopped

  # ------------------------------------------------ Python / data warehouse + ETL
  # Lab 5 (#214): the ETL copies every service's data into the Data Warehouse,
  # one star schema for analysis (see "Data Warehouse" and "ETL" in the README).
  # The ETL owns the warehouse: it creates the schema at start-up. Nobody else
  # writes to it.
  data-warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATA_WAREHOUSE_DB_NAME:-warehouse}
      POSTGRES_USER: ${DATA_WAREHOUSE_DB_USER:?set it in .env — copy .env.example}
      POSTGRES_PASSWORD: ${DATA_WAREHOUSE_DB_PASSWORD:?set it in .env — copy .env.example}
    volumes:
      - data-warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Published for analysis queries (psql, a BI tool) from this machine only.
    ports:
      - "127.0.0.1:${DATA_WAREHOUSE_PORT:-5440}:5432"
    restart: unless-stopped

  etl-service:
    # :latest = the newest version released to main (moved by the repo's release
    # workflow). Run `docker compose pull` to get a new release.
    image: dackohn/etl-service:latest
    # No depends_on on the sources: a source that is down is skipped (the run
    # ends "partial", or "failed" when no source loaded) and the next run
    # catches up.
    depends_on:
      data-warehouse:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    environment:
      PORT: 8091
      WAREHOUSE_URL: postgresql://${DATA_WAREHOUSE_DB_USER}:${DATA_WAREHOUSE_DB_PASSWORD}@data-warehouse:5432/${DATA_WAREHOUSE_DB_NAME:-warehouse}
      # One URL per source, through its read-only role etl_reader and the
      # address the service itself uses (pgpool after replication, so the ETL
      # follows the primary). A source without a URL is skipped.
      USER_MANAGEMENT_ETL_DB_URL: postgresql://etl_reader:${USER_MANAGEMENT_ETL_DB_PASSWORD:?set it in .env — copy .env.example}@user-management-service-db:5432/${USER_MANAGEMENT_DB_NAME:-user_management_db}
      BATTLE_ETL_DB_URL: postgresql://etl_reader:${BATTLE_ETL_DB_PASSWORD:?set it in .env — copy .env.example}@battle-service-db:5432/${BATTLE_DB_NAME:-battle_db}
      TAMAGOTCHI_ETL_DB_URL: postgresql://etl_reader:${TAMAGOTCHI_ETL_DB_PASSWORD:?set it in .env — copy .env.example}@tamagotchi-service-db:5432/${TAMAGOTCHI_DB_NAME:-tamagotchi_db}
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-300}
      ETL_OVERLAP_SECONDS: ${ETL_OVERLAP_SECONDS:-60}
      # POST /runs and GET /runs/latest need the team's admin key (X-Admin-Key).
      # Empty = both endpoints answer 503.
      ADMIN_KEY: ${BROKER_ADMIN_KEY:-}
      # It registers with no topics: Prometheus finds its /metrics and /health
      # there. Nothing calls it in the request path.
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      LOG_LEVEL: ${ETL_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    # One replica only, so a run happens exactly once.
    ports:
      - "${ETL_PORT:-8091}:8091"
    restart: unless-stopped

  # ------------------------------------------------------------ Python / gateway
  # The single entry point: clients, and services calling each other, go
  # through it. It verifies user tokens against User Management's keys, strips
  # Authorization and forwards the verified user as X-User-Id + X-Gateway-Key.
  # Service URLs default to http://<service-name>:<port>, matching this file.
  # ------------------------------------------------ Valkey / shared cache nodes
  # Lab 5 (#230): three cache nodes shared by every service. Each service
  # shards its keys over them with the shared consistent-hash ring
  # (hash-ring/), so a key always lives on the same node. Keys are prefixed
  # with the service name (<service>:<entity>:<id>), which keeps the services
  # apart. A cache only holds copies of database data, so there is no volume
  # and no persistence (--save "", --appendonly no): a restarted node starts
  # empty and refills from the databases. maxmemory + allkeys-lru make a full
  # node evict its least recently used keys instead of refusing writes.

  cache-1:
    image: valkey/valkey:8-alpine
    environment:
      CACHE_PASSWORD: ${CACHE_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$CACHE_PASSWORD\" --save '' --appendonly no --maxmemory ${CACHE_MAXMEMORY:-64mb} --maxmemory-policy allkeys-lru"]
    ports:
      - "${CACHE_1_PUBLISHED_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$CACHE_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cache-2:
    image: valkey/valkey:8-alpine
    environment:
      CACHE_PASSWORD: ${CACHE_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$CACHE_PASSWORD\" --save '' --appendonly no --maxmemory ${CACHE_MAXMEMORY:-64mb} --maxmemory-policy allkeys-lru"]
    ports:
      - "${CACHE_2_PUBLISHED_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$CACHE_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cache-3:
    image: valkey/valkey:8-alpine
    environment:
      CACHE_PASSWORD: ${CACHE_PASSWORD:?set it in .env — copy .env.example}
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$CACHE_PASSWORD\" --save '' --appendonly no --maxmemory ${CACHE_MAXMEMORY:-64mb} --maxmemory-policy allkeys-lru"]
    ports:
      - "${CACHE_3_PUBLISHED_PORT:-6383}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$CACHE_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------- Python / service discovery
  # Where every running instance of every service is (Lab 3). Instances register
  # on start-up and send heartbeats; the registry is in memory, so it needs no
  # database (instances register again after it restarts).
  service-discovery:
    image: dackohn/service-discovery:latest
    environment:
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      INSTANCE_TTL_SECONDS: ${INSTANCE_TTL_SECONDS:-30}
      SWEEP_INTERVAL_SECONDS: ${DISCOVERY_SWEEP_INTERVAL_SECONDS:-5}
      REQUEST_TIMEOUT_SECONDS: ${DISCOVERY_REQUEST_TIMEOUT_SECONDS:-5}
      MAX_CONCURRENT_REQUESTS: ${DISCOVERY_MAX_CONCURRENT_REQUESTS:-100}
      LOG_LEVEL: ${DISCOVERY_LOG_LEVEL:-INFO}
      # Health checks of every registered instance, and alerts when one is critically
      # loaded, unreachable or unhealthy (see the Service Discovery README).
      HEALTH_CHECK_INTERVAL_SECONDS: ${DISCOVERY_HEALTH_CHECK_INTERVAL_SECONDS:-10}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${DISCOVERY_HEALTH_CHECK_TIMEOUT_SECONDS:-3}
      LOAD_ALERT_THRESHOLD: ${DISCOVERY_LOAD_ALERT_THRESHOLD:-0.8}
      # Alerts also go to the team's Telegram alerts topic when these are set (in .env
      # only, never committed); empty = alerts in the log only.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      ALERT_COOLDOWN_SECONDS: ${DISCOVERY_ALERT_COOLDOWN_SECONDS:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    ports:
      - "${DISCOVERY_PORT:-8089}:8089"
    restart: unless-stopped

  # ------------------------------------------------- Python / message broker
  # Carries service-to-service traffic. Requests for a service go on
  # that service's queue and one instance answers (subscriber-based); events go
  # on a topic and every subscribed service gets a copy (topic-based). It reads
  # the instances, and the topics they subscribe to, from Service Discovery.
  message-broker:
    image: dackohn/message-broker:latest
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      BROKER_KEY: ${BROKER_KEY:?set it in .env — copy .env.example}
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      DISCOVERY_REFRESH_SECONDS: ${BROKER_DISCOVERY_REFRESH_SECONDS:-5}
      REQUEST_TIMEOUT_SECONDS: ${BROKER_REQUEST_TIMEOUT_SECONDS:-10}
      MAX_THREADS: ${BROKER_MAX_THREADS:-200}
      MAX_IN_FLIGHT_PER_QUEUE: ${BROKER_MAX_IN_FLIGHT_PER_QUEUE:-50}
      MAX_DELIVERY_ATTEMPTS: ${BROKER_MAX_DELIVERY_ATTEMPTS:-5}
      REDELIVERY_DELAY_SECONDS: ${BROKER_REDELIVERY_DELAY_SECONDS:-2}
      # A failed message goes to another instance at most this often (0 = never).
      MAX_REROUTES: ${BROKER_MAX_REROUTES:-2}
      LOG_LEVEL: ${BROKER_LOG_LEVEL:-INFO}
      # gRPC between services (#170): a call to message-broker:50051 is
      # forwarded to a healthy replica's metadata.grpcPort.
      GRPC_PORT: 50051
      # Durable queues: every event copy is stored on the broker-data volume
      # before the broker answers 202, and survives a restart. A subscriber
      # has ACK_TIMEOUT_SECONDS to acknowledge (empty = the request timeout).
      ACK_TIMEOUT_SECONDS: ${BROKER_ACK_TIMEOUT_SECONDS:-}
      # GET /dead-letters (the Dead Letter Channel) needs this key, not the
      # broker key every service holds. Empty = the endpoint refuses everyone.
      ADMIN_KEY: ${BROKER_ADMIN_KEY:-}
    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    ports:
      - "${BROKER_PORT:-8090}:8090"
      - "${BROKER_GRPC_PORT:-50051}:50051"
    restart: unless-stopped

  # One host port per scaled service for the WebSockets clients open directly
  # (see ws-proxy/nginx.conf): it forwards to whichever replica Docker's DNS gives.
  ws-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - map-service
      - monster-raid-service
      - guild-service
      - package-registry-service
      - battle-service
    volumes:
      - ./ws-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ws-proxy/proxy-headers.inc:/etc/nginx/conf.d/proxy-headers.inc:ro
    ports:
      - "${MAP_PORT:-8085}:8085"
      - "${MONSTER_RAID_PORT:-8086}:8086"
      - "${GUILD_PORT:-8087}:8087"
      - "${PACKAGE_REGISTRY_PORT:-8088}:8088"
      - "${BATTLE_PORT:-8082}:8082"
    restart: unless-stopped

  gateway:
    # :latest = the newest version released to main (moved by the repo's release
    # workflow). Run `docker compose pull` to get a new release.
    image: isstephy1/gateway:latest
    depends_on:
      service-discovery:
        condition: service_healthy
      user-management-service:
        condition: service_started
      battle-service:
        condition: service_started
      tamagotchi-service:
        condition: service_started
      notification-service:
        condition: service_started
      map-service:
        condition: service_started
      monster-raid-service:
        condition: service_started
      guild-service:
        condition: service_started
      package-registry-service:
        condition: service_started
    environment:
      # Its cache on the shared cache nodes (cache-1..3), each key on the node the
      # consistent-hash ring picks. GATEWAY_CACHE_NODES set empty in .env turns it off.
      CACHE_NODES: ${GATEWAY_CACHE_NODES:-cache-1:6379,cache-2:6379,cache-3:6379}
      CACHE_PASSWORD: ${CACHE_PASSWORD:-}
      GATEWAY_KEY: ${GATEWAY_KEY:?set it in .env — copy .env.example}
      AUTH_MODE: ${GATEWAY_AUTH_MODE:-gateway}
      REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-100}
      MAX_CONCURRENT_PER_SERVICE: ${GATEWAY_MAX_CONCURRENT_PER_SERVICE:-50}
      # Message Broker (Lab 4, gateway v4.2.0, Dackohn/gateway#18): every
      # request goes to the service's queue in the broker, which picks the
      # instance, runs the circuit breaker and reroutes. The four Service-only
      # endpoints answer 404, and a service key alone is no credential.
      BROKER_URL: http://message-broker:8090
      BROKER_KEY: ${BROKER_KEY:?set it in .env — copy .env.example}
      # Each service's replicas, read from Service Discovery every
      # GATEWAY_DISCOVERY_REFRESH_SECONDS, for /ws/negotiate and
      # /health/services: the broker picks the instance for every request.
      SERVICE_DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
      DISCOVERY_REFRESH_SECONDS: ${GATEWAY_DISCOVERY_REFRESH_SECONDS:-5}
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      # GET /logs (from gateway v4.0.0): every service's logs, read from Loki,
      # behind X-Admin-Key. The same admin key as the broker's /dead-letters.
      LOKI_URL: ${GATEWAY_LOKI_URL-http://loki:3100}
      ADMIN_KEY: ${BROKER_ADMIN_KEY:-}
      # What GET /ws/negotiate hands to clients: each service's own host port,
      # since the socket connects to the service directly.
      BATTLE_WS_PUBLIC_URL: ws://localhost:${BATTLE_PORT:-8082}
      MAP_WS_PUBLIC_URL: ws://localhost:${MAP_PORT:-8085}
      MONSTER_RAID_WS_PUBLIC_URL: ws://localhost:${MONSTER_RAID_PORT:-8086}
      GUILD_WS_PUBLIC_URL: ws://localhost:${GUILD_PORT:-8087}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped

  # ------------------------------------------------------------- monitoring
  # Prometheus scrapes GET /metrics on every replica (monitoring/prometheus),
  # Promtail ships every container's logs to Loki, and Grafana shows both on a
  # provisioned dashboard: http://localhost:${GRAFANA_PORT:-3000}.
  # Its targets come from Service Discovery, so it scrapes replicas on every
  # machine. The discovery key goes to a file first: Prometheus reads a bearer
  # token only from its config or a file, never from the environment.
  prometheus:
    image: prom/prometheus:v2.53.0
    depends_on:
      - service-discovery
      - blackbox-exporter
    environment:
      DISCOVERY_KEY: ${DISCOVERY_KEY:?set it in .env — copy .env.example}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$DISCOVERY_KEY" > /tmp/discovery_key &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  # Probes every replica's health URL for Prometheus (job "health").
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # Reads the containers from the Docker socket, read-only.
  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail.yml -config.expand-env=true
    depends_on:
      - loki
    environment:
      # Only this stack's containers, not other Compose projects on the machine.
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
      # The `machine` label on every line; each extra machine sets its own
      # (monitoring/docker-compose.logs.yml).
      MACHINE: ${MONITORING_MACHINE_NAME:-main}
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env — copy .env.example}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tamagotchi-go.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

# Named volumes keep each database's data across restarts and rebuilds.
# `docker compose down` keeps them; `docker compose down -v` deletes them.
volumes:
  user-management-service-db-0-data:
  user-management-service-db-1-data:
  user-management-service-db-2-data:
  battle-service-db-0-data:
  battle-service-db-1-data:
  battle-service-db-2-data:
  battle-service-cache-data:
  battle-service-cache-1-data:
  battle-service-cache-2-data:
  tamagotchi-service-db-0-data:
  tamagotchi-service-db-1-data:
  tamagotchi-service-db-2-data:
  notification-service-db-data:
  notification-service-db-1-data:
  notification-service-db-2-data:
  map-service-db-data:
  map-service-db-1-data:
  map-service-db-2-data:
  monster-raid-service-db-0-data:
  monster-raid-service-db-1-data:
  monster-raid-service-db-2-data:
  monster-raid-service-cache-data:
  monster-raid-service-cache-1-data:
  monster-raid-service-cache-2-data:
  guild-service-db-data:
  package-registry-service-db-data:
  data-warehouse-data:
  prometheus-data:
  broker-data:
  loki-data:
  grafana-data:
